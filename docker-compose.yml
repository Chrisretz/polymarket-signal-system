services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pss
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pss
    ports:
      - "5432:5432"
    volumes:
      - pss_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pss -d pss"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pss_pgdata:
