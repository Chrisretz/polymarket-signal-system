# Railway: https://docs.railway.com/reference/config-as-code
# Opret Postgres (Timescale) separat og sæt DATABASE_URL på worker-servicen.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Scheduler har ingen HTTP-server — slå healthcheck fra (ellers stopper Railway containeren)
healthcheckPath = ""
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
