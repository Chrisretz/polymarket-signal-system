# Railway: https://docs.railway.com/reference/config-as-code
# Opret Postgres (Timescale) separat og sæt DATABASE_URL på worker-servicen.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Scheduler eksponerer GET / via health_server.py på PORT
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
