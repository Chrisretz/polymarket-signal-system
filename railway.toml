# Railway deploy-politik (delt). Dockerfile vælges per service via config-as-code:
#   - polymarket-signal-system → railway.json eller railway.toml (Dockerfile)
#   - pss-dashboard          → railway.dashboard.json (Dockerfile.dashboard)
#
# Sæt IKKE dockerfilePath her — det kan overskrive dashboard-servicen.

[deploy]
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
