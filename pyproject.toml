[project]
name = "polymarket-signal-system"
version = "0.1.0"
description = "Polymarket Signal System (PSS) — kvantitativt tradingsystem til Polymarket"
readme = "README.md"
authors = [
    { name = "Chrisretz", email = "Christoffer.retz@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    # Polymarket
    "py-clob-client>=0.34.6",
    # HTTP og async
    "httpx>=0.27.0",
    "websockets>=12.0",
    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=1.0.0",
    "scipy>=1.13.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    # Scheduling
    "apscheduler>=3.10.0",
    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Notifications
    "python-telegram-bot>=21.0",
    # Dashboard
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # Web3 (bruges af py-clob-client)
    "web3>=6.20.0",
    # Logging
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
]

[project.scripts]
pss = "pss:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pss"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
